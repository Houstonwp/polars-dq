[project]
name = "polars-dq"
version = "0.1.0"
description = "Experimental expression-based data-quality checks for Polars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["polars>=1.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.3.4", "ruff>=0.9.2"]

[tool.ruff]
line-length = 100
